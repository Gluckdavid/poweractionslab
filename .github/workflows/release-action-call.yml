name: Release action
# Call the reusable workflow release-solution-with-inputs.yml
# Release your solution to prod when you create a new release.

on:
  release:
      types: [created]        
permissions:
  contents: write
jobs:
  Release-solution-ALMLab:
    uses: ./.github/workflows/release-solution-to-prod-with-inputs.yml
    with:
      #You can specify the solution name here
      solution_name: GithubALMDemo
      #Update your values here
      BUILD_ENVIRONMENT_URL: 'https://org44f00506.crm.dynamics.com/'
      PRODUCTION_ENVIRONMENT_URL: 'https://orgb79c1434.crm.dynamics.com/'
      CLIENT_ID: 'd9a20214-fd30-429f-a909-928d778e28d0'
      TENANT_ID: 'fcedaa2d-3e67-48a8-932f-f5174bd36c29'    
    secrets:
      envSecret: ${{ secrets.POWERPLATFORMSPN }}
