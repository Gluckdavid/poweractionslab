name: release-solution-to-prod

# Converts an unmanaged solution to managed in a build environment,
# saves it as a GitHub artifact, then imports it into Production.

on:
  # Called by release-action-call.yml
  workflow_call:
    inputs:
      solution_name:
        description: "Solution unique name and unpacked source-folder name"
        required: true
        type: string
      BUILD_ENVIRONMENT_URL:
        description: "Build environment URL"
        required: true
        type: string
      PRODUCTION_ENVIRONMENT_URL:
        description: "Production environment URL"
        required: true
        type: string
      CLIENT_ID:
        description: "Microsoft Entra application (client) ID"
        required: true
        type: string
      TENANT_ID:
        description: "Microsoft Entra tenant ID"
        required: true
        type: string
    secrets:
      envSecret:
        description: "SPN client secret supplied by the calling workflow"
        required: true

  # Enables Actions > Run workflow for testing or manual deployment
  workflow_dispatch:
    inputs:
      solution_name:
        description: "Solution unique name and unpacked source-folder name"
        required: true
        type: string
        default: GithubALMDemo
      BUILD_ENVIRONMENT_URL:
        description: "Build environment URL"
        required: true
        type: string
        default: https://org44f00506.crm.dynamics.com/
      PRODUCTION_ENVIRONMENT_URL:
        description: "Production environment URL"
        required: true
        type: string
        default: https://orgb79c1434.crm.dynamics.com/
      CLIENT_ID:
        description: "Microsoft Entra application (client) ID"
        required: true
        type: string
        default: d9a20214-fd30-429f-a909-928d778e28d0
      TENANT_ID:
        description: "Microsoft Entra tenant ID"
        required: true
        type: string
        default: fcedaa2d-3e67-48a8-932f-f5174bd36c29

permissions:
  contents: read

jobs:
  convert-to-managed:
    name: Convert solution to managed
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1.9.2

      - name: Pack unmanaged solution
        uses: microsoft/powerplatform-actions/pack-solution@v1.9.2
        with:
          solution-folder: solutions/${{ inputs.solution_name }}
          solution-file: out/solutions/${{ inputs.solution_name }}.zip
          solution-type: Unmanaged

      - name: Import unmanaged solution to build environment
        uses: microsoft/powerplatform-actions/import-solution@v1.9.2
        with:
          environment-url: ${{ inputs.BUILD_ENVIRONMENT_URL }}
          app-id: ${{ inputs.CLIENT_ID }}
          client-secret: ${{ secrets.envSecret || secrets.POWERPLATFORMSPN }}
          tenant-id: ${{ inputs.TENANT_ID }}
          solution-file: out/solutions/${{ inputs.solution_name }}.zip
          force-overwrite: true
          publish-changes: true
          run-asynchronously: true
          max-async-wait-time: 60

      - name: Export managed solution from build environment
        uses: microsoft/powerplatform-actions/export-solution@v1.9.2
        with:
          environment-url: ${{ inputs.BUILD_ENVIRONMENT_URL }}
          app-id: ${{ inputs.CLIENT_ID }}
          client-secret: ${{ secrets.envSecret || secrets.POWERPLATFORMSPN }}
          tenant-id: ${{ inputs.TENANT_ID }}
          solution-name: ${{ inputs.solution_name }}
          managed: true
          solution-output-file: out/ship/${{ inputs.solution_name }}_managed.zip
          run-asynchronously: true
          max-async-wait-time: 60

      - name: Upload managed solution artifact
        uses: actions/upload-artifact@v4
        with:
          name: managedSolutions
          path: out/ship/${{ inputs.solution_name }}_managed.zip
          if-no-files-found: error

  release-to-production:
    name: Import managed solution to Production
    needs: convert-to-managed
    runs-on: windows-latest

    steps:
      - name: Download managed solution artifact
        uses: actions/download-artifact@v4
        with:
          name: managedSolutions
          path: out/release

      - name: Install Power Platform Tools
        uses: microsoft/powerplatform-actions/actions-install@v1.9.2

      - name: Import managed solution to Production
        uses: microsoft/powerplatform-actions/import-solution@v1.9.2
        with:
          environment-url: ${{ inputs.PRODUCTION_ENVIRONMENT_URL }}
          app-id: ${{ inputs.CLIENT_ID }}
          client-secret: ${{ secrets.envSecret || secrets.POWERPLATFORMSPN }}
          tenant-id: ${{ inputs.TENANT_ID }}
          solution-file: out/release/${{ inputs.solution_name }}_managed.zip
          force-overwrite: true
          publish-changes: true
          run-asynchronously: true
          max-async-wait-time: 60
